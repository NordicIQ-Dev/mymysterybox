# Tests and deploys the Supabase edge functions when anything under supabase/functions changes on main.
# Repo settings > Secrets and variables > Actions:
#   secret   SUPABASE_ACCESS_TOKEN  (supabase.com > Account > Access Tokens)
#   variable SUPABASE_PROJECT_REF   (the id in https://<ref>.supabase.co)
name: Supabase functions
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml", "tests/**"]
  pull_request:
    paths: ["supabase/functions/**", "tests/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
      - run: deno test --allow-env tests/

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
